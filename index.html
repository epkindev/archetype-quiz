function restart(){if(!confirm('Видалити поточні відповіді та почати заново?'))return;state={answers:Array(90).fill(null),index:0,done:false};save();screen='quiz';show()}
function render(){const count=state.answers.filter(valid).length;if(screen==='start'){app.innerHTML=`<p class="muted">90 тверджень · 15 архетипів</p><h1>Опитувальник архетипних патернів особистості</h1><p>Оцініть, наскільки кожне твердження типово для Вас за шкалою від 1 до 5.</p><p>Відповідайте, орієнтуючись на те, наскільки кожне твердження відповідає Вашій типовій поведінці, переживанням і способу реагування.</p><p class="muted">Розроблений на основі інтеграції архетипних концепцій Джин Шиноди Болен, представлених у працях «Goddesses in Everywoman» та «Gods in Everyman».</p><div class="actions"><button class="primary" id="begin">${state.done?'Переглянути результати':count?'Продовжити тест':'Почати тест'}</button>${count?'<button id="reset">Почати заново</button>':''}</div>${count?`<p class="muted">Збережено відповідей: ${count} із 90</p>`:''}`;document.querySelector('#begin').onclick=()=>{screen=state.done?'results':'quiz';show()};if(count)document.querySelector('#reset').onclick=restart;return}
if(screen==='quiz'){const i=state.index;app.innerHTML=`<div class="muted">Твердження ${i+1} із 90 · Відповідей: ${count}</div><progress aria-label="Прогрес відповідей" max="90" value="${count}"></progress><fieldset><legend>${i+1}. ${DATA.questions[i]}</legend>${DATA.options.map((o,n)=>`<label class="option"><input type="radio" name="answer" value="${n+1}" ${state.answers[i]===n+1?'checked':''}><span><b>${n+1}</b> — ${o}</span></label>`).join('')}</fieldset><div class="actions"><button id="back" ${i===0?'disabled':''}>Назад</button><button class="primary" id="next" ${valid(state.answers[i])?'':'disabled'}>${i===89?'Завершити':'Далі'}</button></div><div class="actions"><button id="home">До початку</button></div>`;app.querySelectorAll('input').forEach(el=>el.onchange=()=>{state.answers[i]=Number(el.value);save();document.querySelector('#next').disabled=false});document.querySelector('#back').onclick=()=>{state.index--;save();show()};document.querySelector('#home').onclick=()=>{screen='start';show()};document.querySelector('#next').onclick=()=>{if(!valid(state.answers[i]))return;if(i<89)state.index++;else if(!complete(state.answers)){state.index=state.answers.findIndex(v=>!valid(v));document.querySelector('#notice').textContent='Надайте відповіді на всі 90 тверджень.'}else{state.done=true;screen='results'}save();show()};return}
if(!complete(state.answers)){screen='quiz';render();return}const all=score(state.answers),top=all.filter(x=>x.score>=all[2].score),bottom=[...all].sort((a,b)=>a.score-b.score||a.order-b.order).filter(x=>x.score<=all[12].score);const rows=a=>a.map(x=>`<div class="row"><strong><span>${x.name}</span><span>${x.score} / 30</span></strong><div class="bar"><i style="width:${x.score/30*100}%"></i></div><div class="muted">${level(x.score)}</div></div>`).join('');app.innerHTML=`<p class="muted">Завершено · 90 із 90</p><h1>Ваш архетипний профіль</h1><p>Для кожного архетипу підсумовано шість відповідей. Можливий результат: від 6 до 30 балів.</p><h2>Найвищі показники</h2>${rows(top)}<h2>Найнижчі показники</h2>${rows(bottom)}<p class="muted">Показано три архетипи та всіх, хто має однаковий бал на межі трійки. Однакові бали означають однакову позицію; порядок назв при рівності відповідає ключу документа. За однакових показників архетип може належати до обох груп.</p><h2>Усі 15 архетипів</h2>${rows(all)}<div class="actions"><button class="primary" id="reset">Почати заново</button><button id="edit">Переглянути відповіді</button></div>`;document.querySelector('#reset').onclick=restart;document.querySelector('#edit').onclick=()=>{state.done=false;state.index=0;screen='quiz';save();show()}}
render();function network(){document.querySelector('#offline').textContent=navigator.onLine?'':'Офлайн'}network();addEventListener('online',network);addEventListener('offline',network);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').then(async r=>{await navigator.serviceWorker.ready;document.querySelector('#notice').textContent='Застосунок готовий до роботи офлайн.'}).catch(()=>{document.querySelector('#notice').textContent='Офлайн-режим недоступний. Відкрийте застосунок через HTTPS або localhost.'});
</script></html>
